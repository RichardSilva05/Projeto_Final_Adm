<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Configurações - Painel - Sabino Gesso</title>

    <meta
        name="robots"
        content="noindex, nofollow"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    >

    <link
        rel="stylesheet"
        href="configuracoes.css"
    >

    <script src="sair.js"></script>

</head>


<body>


    <!-- =====================================================
         LAYOUT
    ====================================================== -->

    <div class="layout">


        <!-- =================================================
             SIDEBAR
        ================================================== -->

        <aside class="sidebar">


            <div class="sidebar-logo">

                <img
                    src="logo.png"
                    alt="Logo Sabino Gesso"
                >

            </div>


            <nav>

                <ul>


                    <li>

                        <a href="painel.html">

                            <i class="bi bi-house"></i>

                            <span>
                                Visão Geral
                            </span>

                        </a>

                    </li>


                    <li>

                        <a href="orcamentos.html">

                            <i class="bi bi-receipt"></i>

                            <span>
                                Orçamentos
                            </span>

                        </a>

                    </li>


                    <li>

                        <a href="clientes.html">

                            <i class="bi bi-people"></i>

                            <span>
                                Clientes
                            </span>

                        </a>

                    </li>


                    <li>

                        <a href="relatorios.html">

                            <i class="bi bi-bar-chart-line"></i>

                            <span>
                                Relatórios
                            </span>

                        </a>

                    </li>


                    <li>

                        <a href="projetos.html">

                            <i class="bi bi-kanban"></i>

                            <span>
                                Projetos
                            </span>

                        </a>

                    </li>


                    <li>

                        <a
                            href="configuracoes.html"
                            class="ativo"
                        >

                            <i class="bi bi-gear"></i>

                            <span>
                                Configurações
                            </span>

                        </a>

                    </li>


                    <li class="menu-sair">
                        <a href="login.html" onclick="return confirmarSaida()">
                            <i class="bi bi-box-arrow-right"></i>
                            <span>Sair</span>
                        </a>
                    </li>


                </ul>

            </nav>

        </aside>



        <!-- =================================================
             CONTEÚDO
        ================================================== -->

        <main class="content">


            <!-- =================================================
                 CABEÇALHO
            ================================================== -->

            <div class="cabecalho">

                <h1>
                    Configurações
                </h1>

            </div>



            <!-- =================================================
                 PERFIL DO ADMINISTRADOR
            ================================================== -->

            <section class="card-configuracao">


                <h2>
                    Perfil do Administrador
                </h2>


                <form id="formPerfil">


                    <div class="campos-perfil">


                        <div class="campo">

                            <label for="nome">
                                Nome Completo
                            </label>

                            <input
                                type="text"
                                id="nome"
                                name="nome"
                                value="Fernando Souza"
                                placeholder="Digite seu nome"
                            >

                        </div>


                        <div class="campo">

                            <label for="email">
                                Email
                            </label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                value="fernando.souza@email.com"
                                placeholder="Digite seu email"
                            >

                        </div>


                        <div class="campo">

                            <label for="telefone">
                                Telefone
                            </label>

                            <input
                                type="tel"
                                id="telefone"
                                name="telefone"
                                value="(11) 99999-4321"
                                placeholder="Digite seu telefone"
                            >

                        </div>


                    </div>


                    <button
                        type="submit"
                        class="btn-principal"
                    >

                        Salvar

                    </button>


                </form>

            </section>



            <!-- =================================================
                 NOTIFICAÇÕES
            ================================================== -->

            <section class="card-configuracao">


                <h2>
                    Notificações
                </h2>


                <div class="notificacoes">


                    <label class="opcao-notificacao">

                        <span>
                            Receber notificação por email
                        </span>

                        <input
                            type="checkbox"
                            id="notificacaoEmail"
                            checked
                        >

                        <span class="switch"></span>

                    </label>



                    <label class="opcao-notificacao">

                        <span>
                            Receber atualização via SMS
                        </span>

                        <input
                            type="checkbox"
                            id="notificacaoSms"
                            checked
                        >

                        <span class="switch"></span>

                    </label>


                </div>

            </section>



            <!-- =================================================
                 SEGURANÇA
            ================================================== -->

            <section class="card-configuracao">


                <h2>
                    Segurança
                </h2>


                <form id="formSenha">


                    <div class="campos-senha">


                        <div class="campo">

                            <label for="senhaAtual">
                                Senha Atual
                            </label>

                            <input
                                type="password"
                                id="senhaAtual"
                                name="senhaAtual"
                                placeholder="************"
                            >

                        </div>


                        <div class="campo">

                            <label for="novaSenha">
                                Nova Senha
                            </label>

                            <input
                                type="password"
                                id="novaSenha"
                                name="novaSenha"
                                placeholder="************"
                            >

                        </div>


                    </div>


                    <button
                        type="submit"
                        class="btn-principal"
                    >

                        Alterar Senha

                    </button>


                </form>

            </section>


        </main>


    </div>


    <script src="configuracoes.js"></script>

</body>

</html>
